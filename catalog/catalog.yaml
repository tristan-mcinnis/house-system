# House System catalog — machine-readable inventory of the House layers.
#
# SCOPE (read this before adding a record)
#   This catalog is descriptive. It records what exists, what layer it belongs
#   to, how mature it is, and whether it is public or private. It does NOT own
#   project-to-project relationships: `house/atlas.yaml` is the local
#   relationship authority, and `code-atlas.yaml` owns portfolio purpose, tier
#   and activity. The `relationships` list below holds only inter-layer edges
#   that atlas.yaml does not model.
#
#   One fact, one owner. If a value is owned by another record, reference the
#   owning id; never restate the value here.
#
#   Never put an absolute home path, an email address, a credential, a client
#   name, or private identity content in this file. `make check` fails on the
#   machine-checkable cases and `CLAUDE.md` states the rest.
schema_version: 1
catalog: house-system
scope: >-
  Descriptive inventory of the House surfaces, shared interaction rule,
  orchestration, Pi execution fabric, connectors, local organs, sources of
  truth and inter-layer relationships. Authority for a fact stays with the
  record named in `sources`; this catalog references that record and never
  restates it. Maturity is recorded as current, experimental or aspirational,
  and exposure as public or private, both as of the catalog's last commit.

authority:
  local_relationships: ../atlas.yaml
  portfolio: ../../code-atlas.yaml
  design_values: ../design-system/tokens.json
  code_rule: ../design-system/SWIFT.md
  note: >-
    `../atlas.yaml` owns the project-to-project graph inside the house group and
    the role of each child repository. This catalog cross-checks its project
    slugs against that file during validation. `../../code-atlas.yaml` owns
    portfolio purpose, tier and activity. Neither file is duplicated here.

surfaces:
  - id: sfc-quick-launch
    name: Quick Launch
    kind: macos-app
    repo: quick-launch
    status: current
    visibility: private
    description: "Keyboard-first launcher and instant AI overlay; owns the HouseChatCore package shared with RTI."
    uses: [si-launcher-panel, si-quick-ai, si-ai-chat-window, si-composer, si-chat-context-record, org-local-models, org-memory-recall, org-housechatcore]
  - id: sfc-rti
    name: RTI
    kind: macos-app
    repo: rti
    status: current
    visibility: private
    description: "Meeting capture (recording, live transcript, screenshots, raw session archive to the private knowledge vault) and the in-meeting copilot; analysis and summaries happen downstream, not in the app. Its chats, standalone ones included, are grounded in sessions and the vault; general chat is Quick Launch AI Chat."
    uses: [si-composer, si-chat-context-record, si-session-browser, org-housechatcore, org-local-models]
  - id: sfc-local-dictation
    name: Local Dictation
    kind: macos-app
    repo: local-dictation
    status: current
    visibility: private
    public_candidate: true
    description: "Hold a key, talk, release, and the text lands at the cursor; on-device, never uploaded. Runs its own models in the app for latency and shares only the ~/Models weight store. First candidate for signed public distribution."
    uses: [si-pill, si-setup-checklist, si-dictation-recovery]
  - id: sfc-cotype
    name: Cotype
    kind: menu-bar-app
    repo: cotype
    status: experimental
    visibility: private
    description: "Local AI autocomplete in the menu bar; streams completions from the Local Models daemon (gemma-it) and inserts accepted ghost text; the in-process engine is a legacy fallback. Installed, not yet in daily use."
    uses: [si-menubar-panel, si-status-item, org-local-models]
  - id: sfc-memory-menubar
    name: Memory
    kind: menu-bar-app
    repo: memory-menubar
    status: current
    visibility: private
    description: "Menu-bar face of the memory layer: the screen-context collector's state and switch (read from screenctx), and capture, search and today over the memory repository (through recall)."
    uses: [si-menubar-panel, si-status-item, org-memory-screenctx, org-memory-recall]
  - id: sfc-usage-menubar
    name: Usage
    kind: menu-bar-app
    repo: usage-menubar
    status: current
    visibility: private
    description: "One menu-bar panel for every metered hosted AI source (subscriptions and API balances) on the same percent-used axis."
    uses: [si-menubar-panel, si-status-item, si-meter-row]
  - id: sfc-local-models-menubar
    name: Local Models
    kind: menu-bar-app
    repo: local-models
    status: current
    visibility: private
    description: "Menu-bar face of the local-models daemon: which local models are warm, load and unload, the daemon switch. Usage shows the quota of hosted metered AI; this shows local models."
    uses: [si-menubar-panel, si-status-item, org-local-models]
  - id: sfc-recall-cli
    name: recall
    kind: cli
    repo: memory-recall
    status: current
    visibility: private
    description: "Capture-and-search CLI over the memory repository and open tasks; reached from Quick Launch saved actions and the Memory panel; no screen data."
    uses: [si-terminal-discipline, org-memory-recall]
  - id: sfc-screenctx
    name: screenctx
    kind: cli
    repo: memory-screenctx
    status: current
    visibility: private
    description: "Screen-context collector CLI: accessibility-first text capture and frame-on-change stills with local vision enrichment."
    uses: [si-terminal-discipline, org-local-models]
  - id: sfc-rig
    name: rig
    kind: cli
    repo: rig
    status: experimental
    visibility: private
    description: "Terminal workstation for Pi agents across projects: one tmux session per seat, a shared dashboard session with a narrow phone layout, and verbs to start, send, stop, resume, snapshot and restore."
    uses: [si-terminal-discipline, org-rig]
  - id: sfc-pi-session
    name: Pi session
    kind: agent-surface
    status: current
    visibility: private
    description: "The terminal agent surface that carries the House execution fabric; the parent session orchestrates and owns the final answer."
    uses: [orch-subagent-roles, si-terminal-discipline]

