      visibility: private
      description: "Loads the fresh day packet into each request and fires the matching ops skill deterministically."
    - id: xd-ext-bash-guard
      name: bash-guard
      package: pi-bash-guard
      status: current
      visibility: private
      description: "Blocks destructive shell commands and enforces protected-root search scope."
    - id: xd-ext-browser-route-guard
      name: browser-route-guard
      package: pi (user settings)
      status: current
      visibility: private
      description: "Classifies each turn's browser route and gates UI, fetch and private lanes accordingly."
    - id: xd-ext-search-route-guard
      name: search-route-guard
      package: pi (user settings)
      status: current
      visibility: private
      description: "Routes Chinese queries to the Chinese-first lane by script rather than by model taste."
    - id: xd-ext-pi-workflows
      name: pi-workflows
      package: pi-workflows
      status: current
      visibility: private
      description: "Plan mode, Goal mode and the cooperative workflow bridge as one package."
    - id: xd-ext-pi-dash
      name: pi-dash
      package: pi-dash
      status: current
      visibility: private
