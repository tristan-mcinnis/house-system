  hooks:
    - id: xd-hook-day-packet
      name: Day packet injection
      event: before_agent_start
      enforced_by: xd-ext-ops-hooks
      status: current
      visibility: private
      description: "Reads the fresh, generated daily packet into each request's system prompt; never a memory write."
    - id: xd-hook-ops-skill-trigger
      name: Ops skill trigger
      event: before_agent_start
      enforced_by: xd-ext-ops-hooks
      status: current
      visibility: private
      description: "Loads the exact mail, calendar, Slack or file service for the request instead of relying on skill discovery."
    - id: xd-hook-browser-route
      name: Browser route classification
      event: before_agent_start + tool_call
      enforced_by: xd-ext-browser-route-guard
      status: current
      visibility: private
      description: "Classifies the browser route from raw user input and gates UI, fetch and private lanes per turn."
    - id: xd-hook-search-route
      name: Search route classification
      event: before_agent_start
      enforced_by: xd-ext-search-route-guard
      status: current
      visibility: private
      description: "Chooses the Chinese or global search lane from the query's script."
    - id: xd-hook-destructive-shell
      name: Destructive shell gate
      event: tool_call
      enforced_by: xd-ext-bash-guard
      status: current
      visibility: private
      description: "Refuses destructive bash and out-of-scope recursive searches; proposes an alternative instead of retrying."
    - id: xd-hook-document-mode
      name: Document mode selection
      event: before_agent_start
      enforced_by: xd-ext-document-modes
      status: current
      visibility: private
      description: "Applies the document work mode named by the request prefix."
    - id: xd-hook-effort-budget
      name: Effort budget clamp
      event: before_agent_start + subagent spawn
      enforced_by: xd-ext-effort-budget
      status: current
      visibility: private
      description: "Clamps read-only lookups and subagent deadlines under an enforced quick budget."
    - id: xd-hook-status-footer
      name: Status footer render
      event: session render
      enforced_by: xd-ext-status-line
      status: current
      visibility: private
      description: "Shows model, context and cost, dropping secondary segments as the terminal narrows."
    - id: xd-hook-session-title
      name: Session title
      event: session_start
      enforced_by: xd-ext-short-session-name
      status: current
      visibility: private
      description: "Generates a short session title in the user's language."
  workflows:
    - id: xd-wf-plan-mode
      name: Plan mode
      status: current
      visibility: private
      description: "Formal planning with a review and approval gate; section comments are drafts until sent for revision."
    - id: xd-wf-goal-mode
      name: Goal mode
      status: current
      visibility: private
      description: "Binds long work to a canonical task record with an objective, constraints, acceptance and verification, and pauses at configured limits."
    - id: xd-wf-workflow-bridge
      name: Workflow bridge
      status: current
      visibility: private
      description: "Cooperative bridge that enters the Goal lifecycle for bound long work without a second driver."
    - id: xd-wf-document-modes
      name: Document work modes
      status: current
      visibility: private
      description: "First build, fast edit and final polish select the document cut; a draft-feedback request defaults to fast edits."
    - id: xd-wf-prewalk
      name: Prewalk
      status: experimental
      visibility: private
      description: "Strong model plans and lands the first edit; a cheap model continues the same trajectory."
    - id: xd-wf-maker-checker
      name: Maker then checker
      status: current
      visibility: private
      description: "Whoever built a thing does not ship its verdict; the verification pass runs in a fresh context."
    - id: xd-wf-quick-images
      name: Quick Images
      status: current
      visibility: private
      description: "Streamlined image sourcing and placement mode for a document."
  policies:
    - id: xd-pol-bash-guard
      name: Destructive shell and search scope
      enforced_by: xd-ext-bash-guard
      status: current
      visibility: private
      description: "No recursive traversal of protected roots, no destructive commands; narrow the path instead of overriding."
    - id: xd-pol-browser-route
      name: One browser route per turn
      enforced_by: xd-ext-browser-route-guard
      status: current
      visibility: private
      description: "Static fetch, interactive browser, private local executor and native UI each get their own gate; fail closed."
    - id: xd-pol-search-route
      name: Search lane by script
      enforced_by: xd-ext-search-route-guard
      status: current
      visibility: private
      description: "Chinese sources go to the Chinese-first lane; English and global go to the provider chain."
    - id: xd-pol-draft-only
      name: Draft-only communications
      enforced_by: xd-ext-ops-hooks
      status: current
      visibility: private
      description: "Email and Slack are draft-only until an explicit send or post instruction; Gmail is read-only with no writes at all."
    - id: xd-pol-one-authority
      name: One fact, one owning record
      enforced_by: xd-ext-ops-hooks
      status: current
      visibility: private
      description: "Write to the owner; a derived view is never hand-edited, and a session cache never becomes truth."
    - id: xd-pol-no-silent-publish
      name: No silent publish or spend
      enforced_by: xd-ext-ops-hooks
      status: current
      visibility: private
      description: "Committing is scoped, and publishing, purchasing, deploying and making a repository public need an explicit human decision."

