organs:
  - id: org-design-system
    name: design-system
    kind: library
    repo: design-system
    status: current
    visibility: private
    description: "Machine source of every visual value plus the generators, component registry, lint and the two House rules."
  - id: org-local-models
    name: local-models
    kind: service
    repo: local-models
    status: current
    visibility: private
    description: "Shared local serving layer: model registry, daemon (owns weights, load and unload), CLIs and a Swift client; the Local Models menu bar is its face."
  - id: org-local-tts
    name: local-tts
    kind: service
    repo: local-tts
    status: current
    visibility: private
    description: "Always-on on-device voice service; the text-to-speech organ of the local layer."
  - id: org-memory-screenctx
    name: memory-screenctx
    kind: collector
    repo: memory-screenctx
    status: current
    visibility: private
    description: "The one screen-history collector: accessibility-first text capture with local vision enrichment and a queryable store."
  - id: org-memory-recall
    name: memory-recall
    kind: cli
    repo: memory-recall
    status: current
    visibility: private
    description: "Capture-and-search CLI over the memory repository and open tasks: capture hands a thought to the memory repository's capture CLI (remember is a hidden alias), search scans its markdown. Reads no screen data."
  - id: org-housechatcore
    name: HouseChatCore
    kind: library
    repo: quick-launch
    status: current
    visibility: private
    description: "Chat core package owned by Quick Launch and consumed by RTI; the shared seam between the two apps."
  - id: org-rig
    name: rig
    kind: service
    repo: rig
    status: experimental
    visibility: private
    description: "Seat layer for Pi: a pane-hosted runner that drives Pi over RPC, writes per-seat state files from typed events, and a launchd snapshot every five minutes; no daemon and no database."
  - id: org-house-system
    name: house-system
    kind: documentation
    repo: house-system
    status: experimental
    visibility: private
    description: "Architecture catalog, generated system map and shared conventions for the House family; ships no product and owns no product state."
  - id: org-release-conventions
    name: House release conventions
    kind: convention
    status: aspirational
    visibility: private
    description: "A shared direct-distribution convention (Developer ID, hardened runtime, notarization, Sparkle EdDSA, HTTPS appcast, rollback) that each app applies locally. Design only until the human gates clear."

sources:
  - id: src-house-atlas
    name: house/atlas.yaml
    kind: registry
    owner: house group (hand-edited)
    authority: project-to-project relationships and each child repository's role inside the house group
    status: current
    visibility: private
    description: "Local relationship authority. This catalog references it and cross-checks project slugs during validation."
  - id: src-code-atlas
    name: code-atlas.yaml
    kind: registry
    owner: code directory (hand-edited, generated views derived)
    authority: portfolio purpose, tier, activity and wiring for the whole code directory
    status: current
    visibility: private
    description: "Portfolio authority above the house group; never duplicated inside this repository."
  - id: src-design-values
    name: tokens.json
    kind: token-source
    owner: design-system
    authority: "every visual value: colour, type, spacing, radius, shadow, control height"
    status: current
    visibility: private
    description: "Single machine source of the design values; generated files carry its hash and are never retyped by hand."
  - id: src-code-rule
    name: SWIFT.md
    kind: rule
    owner: design-system
    authority: Swift concurrency, test framework, platform floors and the iOS build path
    status: current
    visibility: private
    description: "The code rule each repository links to and never copies."
  - id: src-project-status
    name: Project status record
    kind: record
    owner: each project
    authority: a project's objective and current state
    status: current
    visibility: private
    description: "The human entry point of a project; the catalog's status field is a summary, never the authority."
  - id: src-task-store
    name: Project task store
    kind: store
    owner: each project
    authority: open and closed work items
    status: current
    visibility: private
    description: "Canonical task records; a session checklist and a generated view are never the store."
  - id: src-decision-record
    name: Accepted decision record
    kind: record
    owner: owning project or memory writer
    authority: accepted decisions and their rationale
    status: current
    visibility: private
    description: "One record per decision; a discussion or quotation never creates one."
  - id: src-personal-identity
    name: Personal identity store
    kind: record
    owner: private memory store (not this repository)
    authority: identity, preferences and direction
    status: current
    visibility: private
    description: "Human-gated and intentionally not mirrored in this repository. Referenced as a boundary only; no content is copied here."
  - id: src-day-packet
    name: Day packet
    kind: generated-view
    owner: ops-hooks (generated, read-only)
    authority: the bounded daily context handed to a fresh agent request
    status: current
    visibility: private
    description: "A derived view. Read-only, never hand-edited, and not a memory store."
  - id: src-session-archive
    name: Session archive
    kind: archive
    owner: the agent runtime
    authority: what happened in a session transcript
    status: current
    visibility: private
    description: "A source archive under its privacy rules; never promoted to truth automatically."
  - id: src-catalog
    name: catalog.yaml
    kind: catalog
    owner: house-system
    authority: the descriptive inventory of House components, their maturity and their exposure
    status: current
    visibility: private
    description: "This file. It describes; it does not authorise and it does not replace any record above."

relationships:
  - id: rel-rig-runs-pi-sessions
    from: org-rig
    to: sfc-pi-session
    kind: runs
    description: "Each rig seat is a Pi session in RPC mode under the rig runner, using the normal Pi agent directory; the dashboard lives outside every Pi session."
  - id: rel-rig-supersedes-pi-dash
    from: org-rig
    to: orch-pi-dash
    kind: supersedes
    status: aspirational
    description: "rig's dashboard lives outside every Pi session; the in-Pi /dash retires once rig covers what it does. Not done yet."
  - id: rel-design-rule-governs-surfaces
    from: si-design-system
    to: sfc-quick-launch
    kind: governs
    description: "Every House surface draws its values from the one design rule; design-system is the source, apps are consumers."
  - id: rel-swift-rule-governs-local-dictation
    from: si-swift-rule
    to: sfc-local-dictation
    kind: applies-with-exception
    description: "Local Dictation is a Rust app, so it follows the design rule and its own crate conventions rather than the Swift rule."
  - id: rel-quicklaunch-owns-chatcore
    from: sfc-quick-launch
    to: org-housechatcore
    kind: owns
    description: "The chat core is owned by Quick Launch and consumed by RTI; one owner, two consumers."
  - id: rel-rti-consumes-chatcore
    from: sfc-rti
    to: org-housechatcore
    kind: consumes
    description: "RTI adopts the shared chat core while keeping its own sources and tests."
  - id: rel-quicklaunch-uses-local-models
    from: sfc-quick-launch
    to: conn-local-models
    kind: uses
    description: "Local answers run against the local serving layer; hosted models go through conn-quick-launch-providers."
  - id: rel-cotype-uses-local-models
    from: sfc-cotype
    to: conn-local-models
    kind: uses
    description: "Completions stream from the daemon-managed llama-server (gemma-it); the daemon owns the weights and their load and unload. The in-process engine is an opt-in legacy fallback."
  - id: rel-memory-menubar-uses-collector
    from: sfc-memory-menubar
    to: org-memory-screenctx
    kind: reads
    description: "The panel runs screenctx status for collector state and capture counts, and switches the collector on and off."
  - id: rel-memory-menubar-uses-recall
    from: sfc-memory-menubar
    to: org-memory-recall
    kind: uses
    description: "Capture, search and today in the panel run the recall CLI; the panel never writes the memory repository itself."
  - id: rel-dictation-shares-model-store
    from: sfc-local-dictation
    to: org-local-models
    kind: shares-weights
    description: "Weights live in the shared ~/Models store; Cohere MLX and S1-mini run in the app, not through the daemon (daemon transcription is phase 2)."
  - id: rel-rti-sends-to-hosted
    from: sfc-rti
    to: conn-rti-hosted
    kind: sends
    description: "Meeting audio and assistant turns leave the machine by default; this is RTI's named exception to local first."
  - id: rel-quicklaunch-hosted-providers
    from: sfc-quick-launch
    to: conn-quick-launch-providers
    kind: sends
    description: "Only when a hosted model is chosen; local models go through conn-local-models."
  - id: rel-usage-reads-provider-apis
    from: sfc-usage-menubar
    to: conn-usage-apis
    kind: reads
    description: "Quota and balance only, never content."
  - id: rel-pi-session-orchestrates
    from: sfc-pi-session
    to: orch-pi-session
    kind: runs
    description: "The terminal agent surface runs the parent session."
  - id: rel-orchestrator-delegates
    from: orch-pi-session
    to: orch-subagent-roles
    kind: delegates
    description: "The parent session decomposes work and delegates within the fixed roster."
  - id: rel-goal-binds-task
    from: xd-wf-goal-mode
    to: src-task-store
    kind: binds
    description: "A bound goal names an existing canonical task record; it never creates a parallel store."
  - id: rel-day-packet-feeds-pi
    from: xd-hook-day-packet
    to: src-day-packet
    kind: reads
    description: "The hook reads the generated packet into each request and writes nothing back."
  - id: rel-browser-policy-gates-browser
    from: xd-pol-browser-route
    to: conn-browser-bsk
    kind: gates
    description: "The browser policy decides whether the interactive lane may be used this turn."
  - id: rel-search-policy-gates-cn
    from: xd-pol-search-route
    to: conn-web-search-cn
    kind: gates
    description: "Chinese-script queries are routed to the Chinese-first lane."
  - id: rel-terminals-follow-rule
    from: si-terminal-discipline
    to: sfc-recall-cli
    kind: governs
    description: "CLI surfaces express the design rule as text discipline."
